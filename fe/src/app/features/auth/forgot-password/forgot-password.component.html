<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<div class="login-wrapper">
  <div class="login-card">

    <div class="card-header-custom">
      <div class="brand-icon">
        <i class="fas fa-unlock-alt"></i>
      </div>
      <h2>Quên Mật Khẩu</h2>
      <p *ngIf="step === 1">Nhập email của bạn để nhận mã xác thực</p>
      <p *ngIf="step === 2">Nhập mã OTP và thiết lập mật khẩu mới</p>
    </div>

    <!-- Step 1: Nhập Email -->
    <form *ngIf="step === 1" [formGroup]="emailForm" (ngSubmit)="onSendCode()">
      <div class="form-group">
        <label for="email">Địa chỉ Email</label>
        <div class="input-container">
          <input type="email" id="email" class="form-input" formControlName="email"
            placeholder="Ví dụ: example@gmail.com">
          <span class="input-icon">
            <i class="fas fa-envelope"></i>
          </span>
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="emailForm.invalid || isLoading">
        <span *ngIf="isLoading"><i class="fas fa-spinner fa-spin"></i> Đang gửi...</span>
        <span *ngIf="!isLoading">Gửi Mã Xác Nhận</span>
      </button>
    </form>

    <!-- Step 2: Nhập OTP và Pass mới -->
    <form *ngIf="step === 2" [formGroup]="resetForm" (ngSubmit)="onResetPassword()">
      
      <div class="email-info mb-3 text-center text-muted" style="font-size: 14px;">
        Mã OTP đã được gửi đến: <strong class="text-dark">{{ emailForm.value.email }}</strong>
        <p class="mb-0 mt-1"><a href="javascript:void(0)" (click)="step = 1" style="color: #6366f1;">Chỉnh sửa Email</a></p>
      </div>

      <div class="form-group">
        <label for="otp">Mã Khôi Phục (OTP)</label>
        <div class="input-container">
          <input type="text" id="otp" class="form-input text-center font-monospace rounded-3 fw-bold" formControlName="otp"
            placeholder="----" maxlength="4" style="letter-spacing: 12px; font-size: 18px;">
        </div>
      </div>

      <div class="form-group">
        <label for="newPassword">Mật khẩu mới</label>
        <div class="input-container">
          <input [type]="showPassword ? 'text' : 'password'" id="newPassword" class="form-input" formControlName="newPassword"
            placeholder="Ít nhất 6 ký tự">
          <span class="input-icon cursor-pointer" (click)="showPassword = !showPassword">
            <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </span>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Nhập lại mật khẩu</label>
        <div class="input-container">
          <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirmPassword" class="form-input" formControlName="confirmPassword"
            placeholder="Xác nhận mật khẩu">
          <span class="input-icon cursor-pointer" (click)="showConfirmPassword = !showConfirmPassword">
            <i class="fas" [ngClass]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </span>
        </div>
        <div *ngIf="resetForm.hasError('mismatch') && resetForm.get('confirmPassword')?.touched" class="text-danger mt-1" style="font-size: 12px;">
          Mật khẩu không khớp!
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="resetForm.invalid || isLoading">
        <span *ngIf="isLoading"><i class="fas fa-spinner fa-spin"></i> Đang xử lý...</span>
        <span *ngIf="!isLoading">Xác Nhận & Đổi Mật Khẩu</span>
      </button>

    </form>

    <div class="footer-link mt-4 text-center">
      <a routerLink="/login" style="color: #64748b; font-weight: 500; text-decoration: none;">
        <i class="fas fa-arrow-left me-1"></i> Quay lại đăng nhập
      </a>
    </div>

  </div>
</div>
